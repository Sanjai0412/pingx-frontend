<svg xmlns="http://www.w3.org/2000/svg"
     width="260"
     height="260"
     viewBox="0 0 260 260"
     role="img"
     aria-label="PingX logo">

  <defs>
    <!-- App icon gradient -->
    <linearGradient id="iconGradient" x1="0.02" y1="0.95" x2="0.98" y2="0.05">
      <stop offset="0%" stop-color="#1238D8"/>
      <stop offset="25%" stop-color="#5420C4"/>
      <stop offset="52%" stop-color="#C72A92"/>
      <stop offset="78%" stop-color="#E92F63"/>
      <stop offset="100%" stop-color="#F45A32"/>
    </linearGradient>

    <!-- Dark lower-right depth -->
    <radialGradient id="iconDepth" cx="85%" cy="88%" r="85%">
      <stop offset="0%" stop-color="#09031F" stop-opacity=".88"/>
      <stop offset="45%" stop-color="#32106E" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- P ribbon gradient -->
    <linearGradient id="brandGradient" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0%" stop-color="#1657F5"/>
      <stop offset="28%" stop-color="#7434E8"/>
      <stop offset="52%" stop-color="#C72BE1"/>
      <stop offset="75%" stop-color="#F044A5"/>
      <stop offset="100%" stop-color="#FF963C"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- APP ICON -->
  <g filter="url(#shadow)">

    <rect
      x="28"
      y="28"
      width="204"
      height="204"
      rx="50"
      fill="url(#iconGradient)"/>

    <rect
      x="28"
      y="28"
      width="204"
      height="204"
      rx="50"
      fill="url(#iconDepth)"/>

    <!-- P -->
    <path
      d="M83 75h65c39 0 62 22 62 54
         0 33-23 55-63 55h-31v37H83V75
         Z
         M116 95v53h28c21 1 31-10 30-17
         0-16-12-26-33-26h-28Z"
      transform="translate(-12 -18)"
      fill="#FFFFFF"/>

    <!-- P ribbon -->
    <path
      d="M84 150
         c14-17 31-24 51-24h26
         c-17 3-29 11-36 24
         c-7 13-18 20-34 20H84v-20Z"
      transform="translate(-12 -18)"
      fill="url(#brandGradient)"/>

  </g>

</svg>